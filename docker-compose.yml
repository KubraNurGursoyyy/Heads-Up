services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: headsup
      POSTGRES_USER: headsup
      POSTGRES_PASSWORD: headsup
    ports:
      - "5432:5432"
    volumes:
      - headsup_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headsup -d headsup"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - headsup_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  headsup_postgres:
  headsup_redis:
